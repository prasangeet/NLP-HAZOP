name: HAZOP validation and benchmark

on:
  push:
    branches:
      - main
      - "research/**"
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hazop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Upload resolved lockfile for dependency review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: resolved-uv-lock
          path: server/uv.lock
          retention-days: 1
      - name: Ruff
        run: uv run ruff check app tests scripts
      - name: Pytest
        run: uv run pytest -v

  benchmark:
    name: Silver-label benchmark (${{ matrix.dataset }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dataset:
          - t301-reconstructed
          - t301-synthetic
          - dwsim-synthetic
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run leakage-aware benchmark
        run: |
          uv run python -m scripts.run_benchmark \
            --dataset "${{ matrix.dataset }}" \
            --seed 42 \
            --test-fraction 0.2 \
            --top-k 10 \
            --max-hops 4
      - name: Upload benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hazop-results-${{ matrix.dataset }}
          path: results/${{ matrix.dataset }}/
          if-no-files-found: error
          retention-days: 30

  neo4j-integration:
    name: Neo4j Query API integration
    runs-on: ubuntu-latest
    env:
      NEO4J_HTTP_URI: http://127.0.0.1:7474
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: test-password
      NEO4J_DATABASE: neo4j
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/test-password
        ports:
          - 7474:7474
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Exercise persistent import and recovery against Neo4j
        run: uv run pytest -v tests/integration/test_neo4j_api.py
