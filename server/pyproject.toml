[project]
name = "server"
version = "0.1.0"
description = "Research prototype for provenance-aware HAZOP missing-link recovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.12,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.18",
    "pypdf==6.21.4",
    "uvicorn>=0.30.0,<1.0.0",
    "ruff>=0.17.2",
    "langchain-google-genai>=4.4.2",
    "google-genai>=2.34.0",
    "google-api-core>=2.43.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
ignore = ["EXE002", "I001"]
