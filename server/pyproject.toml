[project]
name = "server"
version = "0.1.0"
description = "Research prototype for provenance-aware HAZOP missing-link recovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-groq>=1.1.3",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88
