services:
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env; copy .env.example first}"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL_SIZE:-512m}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX_SIZE:-1G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE_SIZE:-512m}"
      HEALTHCHECK_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      HEALTHCHECK_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env; copy .env.example first}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell
          -a bolt://localhost:7687
          -u "$$HEALTHCHECK_USERNAME"
          -p "$$HEALTHCHECK_PASSWORD"
          "RETURN 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
